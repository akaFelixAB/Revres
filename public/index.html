<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Revres</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f7f4ed; /* Parchment tone */
            color: #2b2b2b;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #dcd6cc;
            padding: 40px;
            background-color: #fdfbf7;
        }
        h1 {
            font-size: 22pt;
            text-align: center;
            margin-top: 0;
            font-weight: normal;
            letter-spacing: 1px;
            color: #332211;
        }
        hr {
            border: none;
            border-top: 1px solid #b0a494;
            margin: 20px 0;
        }
        p {
            margin: 0 0 15px 0;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Revres</h1>
        <hr>
        <p>
            <b>Revres</b> is a lightweight, high-performance HTTP web server built with modern C++ for simplicity and speed.
        </p>
    </div>
</body>
</html>
